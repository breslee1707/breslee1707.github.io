<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The site owns its theme via the toggle; theme-color is kept in sync in JS. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#13161c" />

    <title>Le Ngoc Gia Huy — AI Engineer</title>
    <meta
      name="description"
      content="Le Ngoc Gia Huy is an AI Engineer at Intel and co-founder of Code4life, building RAG systems, computer vision, robotics, and AIoT products with production-grade precision."
    />
    <link rel="canonical" href="https://breslee1707.github.io/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://breslee1707.github.io/" />
    <meta property="og:title" content="Le Ngoc Gia Huy — AI Engineer" />
    <meta
      property="og:description"
      content="AI Engineer at Intel and co-founder of Code4life. RAG systems, computer vision, robotics, and AIoT — from prototype to production."
    />
    <meta property="og:image" content="https://breslee1707.github.io/assets/graduation.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Le Ngoc Gia Huy",
        "url": "https://breslee1707.github.io/",
        "jobTitle": "AI Engineer",
        "worksFor": { "@type": "Organization", "name": "Intel" },
        "sameAs": [
          "https://www.linkedin.com/in/lengocgiahuy1810/",
          "https://www.tiktok.com/@huyg.ai",
          "https://github.com/breslee1707"
        ],
        "knowsAbout": [
          "Artificial Intelligence",
          "Retrieval Augmented Generation",
          "Computer Vision",
          "Robotics",
          "AIoT"
        ]
      }
    </script>

    <!-- Set theme before paint to avoid FOUC -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", theme === "light" ? "#f7f8fa" : "#13161c");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
