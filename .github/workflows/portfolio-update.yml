name: Portfolio content update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-update.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch portfolio content
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global html
              if old in html:
                  html = html.replace(old, new, 1)

          if 'Co-founder @Code4life' not in html:
              replace_once('Since November 2025, I have been an AI Engineer at Intel, working at the intersection of machine learning, automation, and applied AI systems.', 'Since November 2025, I have been an AI Engineer at Intel and Co-founder @Code4life®, working at the intersection of machine learning, automation, and applied AI systems.')
              replace_once('At Intel, I continue to focus on applied AI engineering, LLM applications, computer vision, robotics, and data-driven product prototypes.', 'At Intel and Code4life®, I continue to focus on applied AI engineering, LLM applications, computer vision, robotics, and data-driven product prototypes.')
              timeline_marker = '      <div class="wrap timeline">\n        <article class="time-item"><span class="date">Nov 2025 - Present</span><div><h3>AI Engineer, Intel</h3>'
              timeline_insert = '      <div class="wrap timeline">\n        <article class="time-item"><span class="date">Current</span><div><h3>Co-founder, Code4life®</h3><p>Co-building practical learning and software initiatives around AI, automation, and engineering skills.</p></div></article>\n        <article class="time-item"><span class="date">Nov 2025 - Present</span><div><h3>AI Engineer, Intel</h3>'
              replace_once(timeline_marker, timeline_insert)

          if 'tiktok.com/@huyg.ai' not in html:
              replace_once('<a href="https://github.com/breslee1707" target="_blank" rel="noreferrer">GitHub</a>', '<a href="https://github.com/breslee1707" target="_blank" rel="noreferrer">GitHub</a><a href="https://www.tiktok.com/@huyg.ai" target="_blank" rel="noreferrer">TikTok</a>')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit portfolio update
        run: |
          if git diff --quiet; then
            echo "No portfolio changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update portfolio content"
          git push
