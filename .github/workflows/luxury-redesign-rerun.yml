name: Luxury redesign rerun

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/luxury-redesign-rerun.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build portfolio from existing embedded assets
        run: |
          python <<'PY'
          from pathlib import Path
          import base64
          import re
          import zlib

          old = Path('index.html').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/add-graduation-award.yml').read_text(encoding='utf-8')
          packed_match = re.search(r"packed = '([^']+)'", workflow)
          if not packed_match:
              raise SystemExit('Packed template not found in previous workflow')
          packed = packed_match.group(1)

          imgs = re.findall(r'<img[^>]+src="(data:image/[^"]+)"[^>]+alt="([^"]+)"', old, re.S)
          def by_alt_contains(*needles):
              lowered = [n.lower() for n in needles]
              for src, alt in imgs:
                  a = alt.lower()
                  if all(n in a for n in lowered):
                      return src
              raise SystemExit('Missing image matching: ' + ', '.join(needles))

          profile = by_alt_contains('portrait', 'le ngoc gia huy')
          award = by_alt_contains('advantech')
          graduation = by_alt_contains('highest graduation project score')

          html = zlib.decompress(base64.b64decode(packed)).decode('utf-8')
          html = html.replace('__PROFILE__', profile)
          html = html.replace('__AWARD__', award)
          html = html.replace('__GRADUATION__', graduation)
          Path('index.html').write_text(html, encoding='utf-8')
          PY
      - name: Commit redesign
        run: |
          if git diff --quiet; then
            echo "No redesign changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply luxury portfolio redesign"
          git push

