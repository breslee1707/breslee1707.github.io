name: Add graduation award

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-graduation-award.yml'

permissions:
  contents: write

jobs:
  add-award:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refine graduation award figure
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          html_path = Path('index.html')
          workflow_path = Path('.github/workflows/portfolio-update.yml')
          html = html_path.read_text(encoding='utf-8')

          compact_css = (
              '    .proof-certificate { width: min(100%, 360px); margin: 18px auto 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 14px 32px rgba(20, 28, 45, .08); }\n'
              '    .proof-certificate img { display: block; width: 100%; height: auto; object-fit: contain; background: #f7f3ea; }\n'
              '    .proof-certificate figcaption { display: grid; gap: 6px; border-top: 1px solid var(--line); padding: 12px 14px; }\n'
              '    .proof-certificate span { color: var(--orange); font-size: .72rem; font-weight: 850; text-transform: uppercase; }\n'
              '    .proof-certificate strong { font-size: .92rem; line-height: 1.35; }\n'
          )

          css_pattern = re.compile(
              r"    \.proof-certificate \{[^}]+\}\n"
              r"    \.proof-certificate img \{[^}]+\}\n"
              r"    \.proof-certificate figcaption \{[^}]+\}\n"
              r"    \.proof-certificate span \{[^}]+\}\n"
              r"    \.proof-certificate strong \{[^}]+\}\n",
              re.S,
          )
          if css_pattern.search(html):
              html = css_pattern.sub(compact_css, html, count=1)
          else:
              html = html.replace('    .proof-list { display: grid; gap: 18px; }\n', '    .proof-list { display: grid; gap: 18px; }\n' + compact_css, 1)

          if 'Highest graduation project score award certificate' not in html:
              workflow = workflow_path.read_text(encoding='utf-8')
              cert = re.search(r"cert = '([^']+)'", workflow).group(1)
              figure = f'\n      <figure class="wrap proof-certificate">\n        <img src="data:image/webp;base64,{cert}" alt="Highest graduation project score award certificate for Le Ngoc Gia Huy">\n        <figcaption><span>Graduation project recognition</span><strong>Highest graduation project score in Robotics and AI, semester 2/2024-2025.</strong></figcaption>\n      </figure>\n'
              html = html.replace('    <section class="section alt" id="work">', figure + '\n    <section class="section alt" id="work">', 1)

          html = html.replace(
              '<figure class="wrap proof-certificate">\n        <img src="data:image/webp;base64,',
              '<figure class="wrap proof-certificate">\n        <img loading="lazy" decoding="async" src="data:image/webp;base64,',
              1,
          )

          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Commit graduation award refinements
        run: |
          if git diff --quiet; then
            echo "No graduation award refinements needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine graduation award image display"
          git push

