name: Luxury portfolio redesign

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-graduation-award.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build dark luxury portfolio
        run: |
          python <<'PY'
          from pathlib import Path
          import base64
          import re
          import zlib

          old = Path('index.html').read_text(encoding='utf-8')

          def image_for(alt):
              pattern = r'<img[^>]+src="(data:image/[^\"]+)"[^>]+alt="' + re.escape(alt) + r'"'
              match = re.search(pattern, old, re.S)
              if not match:
                  raise SystemExit(f'Missing image with alt: {alt}')
              return match.group(1)

          profile = image_for('Portrait of Le Ngoc Gia Huy')
          award = image_for('Le Ngoc Gia Huy receiving first prize at Advantech AIoT InnoWorks 2022')
          graduation = image_for('Highest graduation project score award certificate for Le Ngoc Gia Huy')

          packed = ''

          html = zlib.decompress(base64.b64decode(packed)).decode('utf-8')
          html = html.replace('__PROFILE__', profile).replace('__AWARD__', award).replace('__GRADUATION__', graduation)
          Path('index.html').write_text(html, encoding='utf-8')
          PY
      - name: Commit redesign
        run: |
          if git diff --quiet; then
            echo "No redesign changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign portfolio with luxury tech aesthetic"
          git push

