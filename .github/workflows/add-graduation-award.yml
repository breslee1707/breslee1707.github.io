name: Add graduation award

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-graduation-award.yml'

permissions:
  contents: write

jobs:
  add-award:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prevent award photo cropping
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          # Keep the Advantech award photo fully visible instead of cropping the sides.
          html = re.sub(
              r"    \.proof-grid \{[^}]+\}\n",
              "    .proof-grid { display: grid; grid-template-columns: .82fr 1fr; gap: 18px; align-items: start; }\n",
              html,
              count=1,
          )
          html = re.sub(
              r"    \.proof-photo img \{[^}]+\}\n",
              "    .proof-photo img { display: block; width: 100%; height: auto; min-height: 0; max-height: 720px; object-fit: contain; object-position: center top; background: var(--surface); }\n",
              html,
              count=1,
          )

          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Commit award photo display fix
        run: |
          if git diff --quiet; then
            echo "No award photo display changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Prevent award photo cropping"
          git push

