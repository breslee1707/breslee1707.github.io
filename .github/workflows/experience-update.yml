name: Experience timeline update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/experience-update.yml'

permissions:
  contents: write

jobs:
  update-experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add missing experience items
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          timeline = '''      <div class="wrap timeline reveal">
        <article class="time-item">
          <div class="date">Nov 2025 to present</div>
          <div><h3>AI Engineer, Intel</h3><p>Working on applied AI engineering, automation, and intelligent systems in a production-minded environment.</p></div>
        </article>
        <article class="time-item">
          <div class="date">Current</div>
          <div><h3>Co-founder, Code4life&reg;</h3><p>Building learning and technology initiatives around practical coding, AI literacy, and software craft.</p></div>
        </article>
        <article class="time-item">
          <div class="date">Aug 2024 to Feb 2025</div>
          <div><h3>AI / RAG Engineer, RegenX</h3><p>Developed a document question answering system using RAG, Qdrant vector search, Supabase metadata, semantic chunking, reranking, and OpenAI models for internal company documents.</p></div>
        </article>
        <article class="time-item">
          <div class="date">Jan 2024 to Jul 2024</div>
          <div><h3>AI Robotics Intern, ABB Robotics</h3><p>Built an AI-based robotic arm inspection workflow with Autodesk Inventor, MATLAB/Simulink, PyTorch, TensorFlow, OpenCV, RobotStudio, and real-time C# socket communication.</p></div>
        </article>
        <article class="time-item">
          <div class="date">2024 to 2025</div>
          <div><h3>Robotics and AI, HCMUTE</h3><p>Completed graduation-level work recognized with the highest project score in the major for semester 2/2024-2025.</p></div>
        </article>
      </div>'''
          pattern = r'      <div class="wrap timeline reveal">.*?\n      </div>\n    </section>\n\n    <section id="about">'
          replacement = timeline + '\n    </section>\n\n    <section id="about">'
          html, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Experience timeline block not found')
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit experience update
        run: |
          if git diff --quiet; then
            echo "No experience changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add RegenX and ABB experience to timeline"
          git push

